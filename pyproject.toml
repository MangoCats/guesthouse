[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adu"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
adjust = ["numpy", "scipy"]
gen = ["PyMuPDF", "Pillow", "numpy", "scipy"]
test = ["pytest"]
app = ["flask"]

[tool.setuptools.packages.find]
include = ["shared", "shared.*", "floorplan", "floorplan.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["survey/adjust_pentagon.py", "survey/compute_path.py"]
