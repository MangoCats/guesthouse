<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest House</title>
<style>
  body { margin: 0; padding: 1rem; background: #1a1a1a; color: #eee;
         font-family: system-ui, sans-serif; }
  h1 { text-align: center; font-size: 1.4rem; margin: 0.5rem 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: #aaa; }
  .section { max-width: 1200px; margin: 0 auto; }
  .hero img { width: 100%; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
          gap: 0.75rem; }
  .grid figure { margin: 0; }
  .grid img { width: 100%; border-radius: 4px; }
  .grid figcaption { text-align: center; font-size: 0.85rem; color: #999;
                     margin-top: 0.25rem; }
</style>
</head>
<body>

<h1>Guest House</h1>

<div class="section">
  <div class="hero">
    <img src="site_plan_df.png" alt="Site plan">
  </div>

  <h2>Flat Roof</h2>
  <div class="grid">
    <figure><img src="flat_roof_patio.png" alt="Flat roof — patio view">
      <figcaption>Patio View</figcaption></figure>
    <figure><img src="flat_roof_corner.png" alt="Flat roof — corner view">
      <figcaption>Corner View</figcaption></figure>
    <figure><img src="flat_roof_bumpout.png" alt="Flat roof — stairwell view">
      <figcaption>Stairwell View</figcaption></figure>
  </div>

  <h2>2-in-12 Roof</h2>
  <div class="grid">
    <figure><img src="2in12_patio.png" alt="2-in-12 roof — patio view">
      <figcaption>Patio View</figcaption></figure>
    <figure><img src="2in12_corner.png" alt="2-in-12 roof — corner view">
      <figcaption>Corner View</figcaption></figure>
    <figure><img src="2in12_bumpout.png" alt="2-in-12 roof — stairwell view">
      <figcaption>Stairwell View</figcaption></figure>
  </div>

  <h2>Floorplan</h2>
  <div class="hero">
    <img src="floorplan_minik.svg" alt="Floorplan">
  </div>
</div>

</body>
</html>
