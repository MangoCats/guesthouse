<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daybed Layout Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: sans-serif;
    }
    h1 {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
      font-size: 1.4rem;
      color: #cba6f7;
    }
    .layout {
      width: 100%;
      padding: 1.5rem 0;
      border-bottom: 1px solid #313244;
    }
    .layout:last-child { border-bottom: none; }
    .label {
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #89b4fa;
      margin-bottom: 0.5rem;
    }
    .layout img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Daybed Layout Options</h1>

  <div class="layout">
    <div class="label">Base</div>
    <img src="Base_daybed.svg" alt="Base Daybed Layout">
  </div>

  <div class="layout">
    <div class="label">Mark 6</div>
    <img src="Mark6_daybed.svg" alt="Mark6 Daybed Layout">
  </div>

  <div class="layout">
    <div class="label">Mark 8</div>
    <img src="Mark8_daybed.svg" alt="Mark8 Daybed Layout">
  </div>

  <div class="layout">
    <div class="label">Mark 9</div>
    <img src="Mark9_daybed.svg" alt="Mark9 Daybed Layout">
  </div>

  <div class="layout">
    <div class="label">Mark X</div>
    <img src="MarkX_daybed.svg" alt="MarkX Daybed Layout">
  </div>
</body>
</html>
