<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daybed Layout Options</title>

  <!-- Embedded GLB data (base64) — works on file:// without a local server -->
  <script src="models.js"></script>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <script>
    // Convert a base64-encoded GLB string to a Blob URL that model-viewer can load.
    // Using Blob URLs avoids the fetch() restriction on file:// pages.
    function glbToUrl(b64) {
      var bin = atob(b64);
      var buf = new ArrayBuffer(bin.length);
      var bytes = new Uint8Array(buf);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([buf], {type: 'model/gltf-binary'}));
    }

    document.addEventListener('DOMContentLoaded', function() {
      var flatUrl = glbToUrl(window.GLB_FLAT_ROOF);
      var in12Url = glbToUrl(window.GLB_2IN12);
      document.querySelectorAll('model-viewer[data-model="flat_roof"]').forEach(function(v) { v.src = flatUrl; });
      document.querySelectorAll('model-viewer[data-model="2in12"]').forEach(function(v) { v.src = in12Url; });
    });
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: sans-serif;
    }
    h1 {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
      font-size: 1.4rem;
      color: #cba6f7;
    }
    .layout {
      width: 100%;
      padding: 1.5rem 0;
      border-bottom: 1px solid #313244;
    }
    .layout:last-child { border-bottom: none; }
    .label {
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #89b4fa;
      margin-bottom: 0.5rem;
    }
    model-viewer {
      display: block;
      width: 100%;
      height: 340px;
      background-color: #181825;
      --poster-color: #181825;
      margin-bottom: 0.5rem;
    }
    /* aspect-ratio matches SVG viewBox: 769.40 wide × 594.54 tall ≈ 792×612 */
    object {
      display: block;
      width: 100%;
      aspect-ratio: 792 / 612;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Daybed Layout Options — click furniture for product links</h1>

  <div class="layout">
    <div class="label">Base</div>
    <model-viewer data-model="2in12"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Base — 2:12 pitched roof 3D model">
    </model-viewer>
    <object data="Base_daybed.svg" type="image/svg+xml">Base daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 6</div>
    <model-viewer data-model="2in12"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 6 — 2:12 pitched roof 3D model">
    </model-viewer>
    <object data="Mark6_daybed.svg" type="image/svg+xml">Mark6 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 8</div>
    <model-viewer data-model="flat_roof"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 8 — flat roof 3D model">
    </model-viewer>
    <object data="Mark8_daybed.svg" type="image/svg+xml">Mark8 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 9</div>
    <model-viewer data-model="flat_roof"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 9 — flat roof 3D model">
    </model-viewer>
    <object data="Mark9_daybed.svg" type="image/svg+xml">Mark9 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark X</div>
    <model-viewer data-model="flat_roof"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark X — flat roof 3D model">
    </model-viewer>
    <object data="MarkX_daybed.svg" type="image/svg+xml">MarkX daybed layout</object>
  </div>
</body>
</html>
