<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daybed Layout Options</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: sans-serif;
    }
    h1 {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
      font-size: 1.4rem;
      color: #cba6f7;
    }
    .layout {
      width: 100%;
      padding: 1.5rem 0;
      border-bottom: 1px solid #313244;
    }
    .layout:last-child { border-bottom: none; }
    .label {
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #89b4fa;
      margin-bottom: 0.5rem;
    }
    /* 3-D viewer */
    model-viewer {
      display: block;
      width: 100%;
      height: 340px;
      background-color: #181825;
      --poster-color: #181825;
      margin-bottom: 0.5rem;
    }
    /* aspect-ratio matches SVG viewBox: 769.40 wide × 594.54 tall ≈ 792×612 */
    object {
      display: block;
      width: 100%;
      aspect-ratio: 792 / 612;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Daybed Layout Options — click furniture for product links</h1>

  <div class="layout">
    <div class="label">Base</div>
    <model-viewer src="2in12.glb"
      camera-orbit="225deg 75deg auto"
      min-camera-orbit="auto auto auto"
      max-camera-orbit="auto auto auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Base — 2:12 pitched roof 3D model">
    </model-viewer>
    <object data="Base_daybed.svg" type="image/svg+xml">Base daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 6</div>
    <model-viewer src="2in12.glb"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 6 — 2:12 pitched roof 3D model">
    </model-viewer>
    <object data="Mark6_daybed.svg" type="image/svg+xml">Mark6 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 8</div>
    <model-viewer src="flat_roof.glb"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 8 — flat roof 3D model">
    </model-viewer>
    <object data="Mark8_daybed.svg" type="image/svg+xml">Mark8 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark 9</div>
    <model-viewer src="flat_roof.glb"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark 9 — flat roof 3D model">
    </model-viewer>
    <object data="Mark9_daybed.svg" type="image/svg+xml">Mark9 daybed layout</object>
  </div>

  <div class="layout">
    <div class="label">Mark X</div>
    <model-viewer src="flat_roof.glb"
      camera-orbit="225deg 75deg auto"
      camera-controls
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="8deg"
      shadow-intensity="0.8"
      exposure="1.1"
      alt="Mark X — flat roof 3D model">
    </model-viewer>
    <object data="MarkX_daybed.svg" type="image/svg+xml">MarkX daybed layout</object>
  </div>
</body>
</html>
